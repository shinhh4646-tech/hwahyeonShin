<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse | My Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-blue: #0A84FF;
            --accent-green: #30D158;
            --text-main: #FFFFFF;
            --text-sub: #8E8E93;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding-bottom: 100px;
            letter-spacing: -0.2px;
        }

        /* 상단 헤더: My Network */
        header {
            padding: 25px 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title { font-size: 22px; font-weight: 800; }

        /* 활동 지표 섹션: 사용자 친화적 데이터로 변경 */
        .activity-stats {
            display: flex;
            justify-content: space-around;
            padding: 25px 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            margin: 20px;
            border-radius: 20px;
        }

        .stat-item { text-align: center; flex: 1; }
        .stat-value { font-size: 20px; font-weight: 700; display: block; margin-bottom: 4px; }
        .stat-label { font-size: 10px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }

        /* 리스트 제목 */
        h2 { font-size: 13px; color: var(--text-sub); padding: 0 20px; margin: 30px 0 12px; font-weight: 600; text-transform: uppercase; }

        .list-container { padding: 0 15px; }
        
        /* 유저 카드 스타일 */
        .user-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .user-card:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.1); }

        .user-info { display: flex; align-items: center; gap: 12px; }
        
        /* 기본형 아바타 */
        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #2C2C2E;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .name-stack { display: flex; flex-direction: column; }
        .user-name { font-weight: 600; font-size: 15px; }
        .status-info { font-size: 12px; color: var(--accent-blue); margin-top: 2px; }

        .btn-connect {
            background: #FFFFFF;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
        }

        /* 하단 탭 바 (Dock) */
        .nav-dock {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 64px;
            background: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        .nav-link { text-decoration: none; font-size: 12px; color: var(--text-sub); font-weight: 600; }
        .nav-link.active { color: #fff; }
        .add-btn { 
            width: 44px; height: 44px; background: #fff; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            color: #000; font-size: 24px; font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">My Network</div>
        <div style="font-size: 18px; opacity: 0.8;">🔍</div>
    </header>

    <!-- 사용자 친화적 활동 지표 -->
    <section class="activity-stats">
        <div class="stat-item">
            <span class="stat-value">124</span>
            <span class="stat-label">Friends</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" style="color: var(--accent-green);">85%</span>
            <span class="stat-label">Authentic</span>
        </div>
        <div class="stat-item">
            <span class="stat-value">12d</span>
            <span class="stat-label">Streak</span>
        </div>
    </section>

    <h2>Recent Connections</h2>
    <div class="list-container">
        <div class="user-card">
            <div class="user-info">
                <div class="avatar">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Alex&backgroundColor=b6e3f4" alt="User">
                </div>
                <div class="name-stack">
                    <span class="user-name">Alex Johnson</span>
                    <span class="status-info">1st Connection</span>
                </div>
            </div>
            <div style="font-size: 18px; opacity: 0.5;">✉️</div>
        </div>
    </div>

    <h2>Recommended</h2>
    <div class="list-container">
        <div class="user-card">
            <div class="user-info">
                <div class="avatar">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Sarah&backgroundColor=ffdfbf" alt="User">
                </div>
                <div class="name-stack">
                    <span class="user-name">Sarah Miller</span>
                    <span class="status-info" style="color: var(--text-sub);">2nd Connection</span>
                </div>
            </div>
            <button class="btn-connect">Connect</button>
        </div>

        <div class="user-card">
            <div class="user-info">
                <div class="avatar">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Lucas&backgroundColor=d1d4f9" alt="User">
                </div>
                <div class="name-stack">
                    <span class="user-name">Lucas Bernard</span>
                    <span class="status-info" style="color: var(--text-sub);">Mutual Friend</span>
                </div>
            </div>
            <button class="btn-connect">Connect</button>
        </div>
    </div>

    <nav class="nav-dock">
        <a href="index.html" class="nav-link">Feed</a>
        <div class="add-btn">+</div>
        <a href="#" class="nav-link active">Network</a>
    </nav>

</body>
</html>
