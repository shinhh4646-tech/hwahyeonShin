<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse | Authentic Moments</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --primary-blue: #007AFF;
            --on-time: #30D158;
            --late-color: #FFD60A;
            --text-main: #FFFFFF;
            --text-sub: #8E8E93;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            padding-bottom: 80px;
        }

        /* 상단 헤더: 타이머 강조 */
        header {
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.9);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
            z-index: 10;
        }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
        .timer { font-size: 12px; color: var(--late-color); margin-top: 4px; }

        /* 피드 리스트 */
        .feed { max-width: 500px; margin: 0 auto; padding: 10px; }

        .post-card {
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .user-bar {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; background: #333; }
        .distance { font-size: 11px; color: var(--primary-blue); border: 1px solid var(--primary-blue); padding: 2px 6px; border-radius: 4px; }

        /* 영상 영역 (2~3초 루프 시뮬레이션) */
        .video-container {
            width: 100%;
            aspect-ratio: 3/4;
            background: #1a1a1a;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .on-time-bg { background: var(--on-time); color: #000; }
        .late-bg { background: var(--late-color); color: #000; }

        /* 하단 네비게이션 */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: rgba(18, 18, 18, 0.95);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #333;
        }
        .nav-item { color: var(--text-sub); font-size: 10px; text-decoration: none; text-align: center; }
        .nav-item.active { color: var(--text-main); }
        .post-btn {
            width: 50px;
            height: 50px;
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">PULSE</div>
        <div class="timer">Next Notification in 00:42:15</div>
    </header>

    <main class="feed">
        <!-- 포스트 예시 1: 정시 업로드 친구 -->
        <article class="post-card">
            <div class="user-bar">
                <div class="user-info">
                    <div class="avatar"></div>
                    <div>
                        <div style="font-size: 14px; font-weight: 600;">Jina Hwang</div>
                        <div style="font-size: 11px; color: var(--text-sub);">Paris, France</div>
                    </div>
                </div>
                <span class="distance">1st</span>
            </div>
            <div class="video-container">
                <span class="status-badge on-time-bg">Authentic</span>
                <p style="color: #444;">[ 3s Video Fragment ]</p>
            </div>
        </article>

        <!-- 포스트 예시 2: 늦게 업로드한 친구 (그래프 2촌 관계) -->
        <article class="post-card">
            <div class="user-bar">
                <div class="user-info">
                    <div class="avatar"></div>
                    <div>
                        <div style="font-size: 14px; font-weight: 600;">Emma (Friend's Friend)</div>
                        <div style="font-size: 11px; color: var(--text-sub);">London, UK</div>
                    </div>
                </div>
                <span class="distance">2nd</span>
            </div>
            <div class="video-container">
                <span class="status-badge late-bg">24m Late</span>
                <p style="color: #444;">[ 2s Video Fragment ]</p>
            </div>
        </article>
    </main>

    <nav class="nav-bar">
        <a href="#" class="nav-item active"><div>Feed</div></a>
        <a href="#" class="nav-item"><div class="post-btn"></div></a>
        <a href="#" class="nav-item"><div>Network</div></a>
    </nav>

</body>
</html>
