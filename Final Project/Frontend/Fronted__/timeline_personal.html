<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse | My Daily Vlog</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --accent-green: #30D158; /* 'Authentic' vibe */
            --text-main: #FFFFFF;
            --text-sub: #8E8E93;
            --border-color: #262626;
        }

        body {
            background-color: #111;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        /* Mobile Container */
        .phone-container {
            width: 375px;
            height: 812px;
            background: var(--bg-color);
            border-radius: 44px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #333;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }

        /* Header */
        header {
            padding: 55px 20px 15px;
            text-align: center;
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid var(--border-color);
        }
        .vlog-title { font-size: 16px; font-weight: 800; letter-spacing: 4px; color: var(--text-main); }
        .date { font-size: 11px; color: var(--text-sub); margin-top: 5px; letter-spacing: 1px; }

        /* Timeline Feed */
        .vlog-feed {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .vlog-feed::-webkit-scrollbar { display: none; }

        /* Setlog Landscape Card */
        .moment-card {
            width: 100%;
            aspect-ratio: 2.1 / 1;
            background: var(--card-bg);
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }
        .moment-card:active { transform: scale(0.98); }

        .media-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.5;
        }

        /* Content Overlay */
        .content-layer {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .time-stamp { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
        .activity-desc { font-size: 13px; color: #bbb; margin-top: 4px; font-weight: 300; }

        /* Pulse Status Badge */
        .status-pill {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            background: var(--accent-green);
            color: #000;
            text-transform: uppercase;
        }

        /* Footer Navigation */
        nav {
            height: 85px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .nav-text { font-size: 11px; font-weight: 700; color: var(--text-sub); }
        .nav-text.active { color: var(--text-main); }
        .capture-btn {
            width: 50px;
            height: 50px;
            border: 4px solid white;
            border-radius: 50%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <header>
        <div class="vlog-title">MY DAILY LOG</div>
        <div class="date">FRIDAY, MAY 1, 2026</div>
    </header>

    <main class="vlog-feed">
        <!-- 13:00 Moment -->
        <article class="moment-card">
            <div class="media-layer" style="background-image: url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=500');"></div>
            <span class="status-pill">Recorded</span>
            <div class="content-layer">
                <div class="time-stamp">13:00</div>
                <div class="activity-desc">Quick lunch at the cafe</div>
            </div>
        </article>

        <!-- 14:00 Moment -->
        <article class="moment-card">
            <div class="media-layer" style="background-image: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?w=500');"></div>
            <span class="status-pill">Recorded</span>
            <div class="content-layer">
                <div class="time-stamp">14:00</div>
                <div class="activity-desc">Focused work session</div>
            </div>
        </article>

        <!-- 15:00 Moment -->
        <article class="moment-card">
            <div class="media-layer" style="background-image: url('https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=500');"></div>
            <span class="status-pill">Recorded</span>
            <div class="content-layer">
                <div class="time-stamp">15:00</div>
                <div class="activity-desc">Afternoon stretching</div>
            </div>
        </article>

        <!-- 16:00 Moment -->
        <article class="moment-card">
            <div class="media-layer" style="background-image: url('https://images.unsplash.com/photo-1559339352-11d035aa65de?w=500');"></div>
            <span class="status-pill">Recorded</span>
            <div class="content-layer">
                <div class="time-stamp">16:00</div>
                <div class="activity-desc">Back on the road</div>
            </div>
        </article>
    </main>

    <nav>
        <div class="nav-text active">VLOG</div>
        <div class="capture-btn"></div>
        <div class="nav-text">MEMORIES</div>
    </nav>
</div>

</body>
</html>
