<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse | Setlog Layout</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --accent-blue: #007AFF;
            --on-time: #30D158;
            --late-color: #FFD60A;
            --text-main: #FFFFFF;
            --text-sub: #8E8E93;
            --border-color: #222;
        }

        body {
            background-color: #1a1a1a;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        /* Mobile Frame */
        .phone-container {
            width: 375px;
            height: 812px;
            background: var(--bg-color);
            border-radius: 44px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #333;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        /* Header */
        header {
            padding: 50px 20px 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.8);
        }
        .logo { font-size: 18px; font-weight: 800; letter-spacing: 3px; }
        .timer { font-size: 11px; color: var(--late-color); margin-top: 5px; font-weight: 500; }

        /* Feed: Setlog Vertical Stack */
        .feed {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .feed::-webkit-scrollbar { display: none; }

        /* Setlog Landscape Card in Pulse Style */
        .log-card {
            width: 100%;
            aspect-ratio: 2.1 / 1; /* Horizontal ratio from image_585c3d.jpg */
            background: var(--card-bg);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .media-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.5; /* Pulse-style dark overlay */
        }

        /* Card Content */
        .card-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .card-time { font-size: 26px; font-weight: 900; }
        .card-caption { font-size: 13px; color: #ccc; margin-top: 2px; }

        /* Badges */
        .badge-status {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .authentic { background: var(--on-time); color: #000; }
        .late { background: var(--late-color); color: #000; }

        .badge-distance {
            position: absolute;
            bottom: 12px;
            left: 12px;
            font-size: 10px;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* Nav Bar */
        nav {
            height: 80px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .nav-item { color: var(--text-sub); font-size: 11px; font-weight: 600; cursor: pointer; }
        .nav-item.active { color: var(--text-main); }
        .camera-btn {
            width: 48px;
            height: 48px;
            border: 3px solid white;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <header>
        <div class="logo">PULSE</div>
        <div class="timer">NEXT NOTIFICATION IN 00:42:15</div>
    </header>

    <main class="feed">
        <!-- Card 1 -->
        <article class="log-card">
            <div class="media-bg" style="background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500');"></div>
            <span class="badge-status authentic">Authentic</span>
            <span class="badge-distance">1st</span>
            <div class="card-content">
                <div class="card-time">1:00 PM</div>
                <div class="card-caption">Sunny day at the park</div>
            </div>
        </article>

        <!-- Card 2 -->
        <article class="log-card">
            <div class="media-bg" style="background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500');"></div>
            <span class="badge-status late">24m Late</span>
            <span class="badge-distance">2nd</span>
            <div class="card-content">
                <div class="card-time">1:00 PM</div>
                <div class="card-caption">Coffee break in London</div>
            </div>
        </article>

        <!-- Card 3 -->
        <article class="log-card">
            <div class="media-bg" style="background-image: url('https://images.unsplash.com/photo-1493246507139-91e8bef99c02?w=500');"></div>
            <span class="badge-status authentic">Authentic</span>
            <span class="badge-distance">1st</span>
            <div class="card-content">
                <div class="card-time">1:00 PM</div>
                <div class="card-caption">Quiet mountain vibes</div>
            </div>
        </article>

        <!-- Card 4 -->
        <article class="log-card">
            <div class="media-bg" style="background-image: url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=500');"></div>
            <span class="badge-status late">1h Late</span>
            <span class="badge-distance">2nd</span>
            <div class="card-content">
                <div class="card-time">1:00 PM</div>
                <div class="card-caption">Coding all night</div>
            </div>
        </article>
    </main>

    <nav>
        <div class="nav-item active">FEED</div>
        <div class="camera-btn"></div>
        <div class="nav-item">NETWORK</div>
    </nav>
</div>

</body>
</html>
