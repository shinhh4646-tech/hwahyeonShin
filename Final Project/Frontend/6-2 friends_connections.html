<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse | Connections</title>
    <style>
        /* 1. Pulse 테마: 블랙 & 미니멀 스타일 */
        :root {
            --bg-color: #000000;
            --text-main: #FFFFFF;
            --text-sub: #A8A8A8;
            --border-color: #262626;
            --accent-blue: #0095f6;
            --heart-red: #ed4956;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding-bottom: 60px;
        }

        /* 2. 상단 헤더 */
        header {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.95);
            padding: 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }
        .back-btn { 
            font-size: 20px; 
            text-decoration: none; 
            color: white; 
            margin-right: 20px; 
            cursor: pointer;
        }
        .header-title { font-size: 18px; font-weight: 700; }

        /* 3. 팔로워/팔로잉 탭 디자인 */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--text-main);
        }

        /* 4. 사용자 리스트 영역 */
        .list-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 10px 0;
            display: none; 
        }
        .list-container.active {
            display: block; 
        }

        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            text-decoration: none;
            color: inherit;
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { 
            width: 44px; height: 44px; border-radius: 50%; 
            background: #333; border: 1px solid var(--border-color);
            object-fit: cover;
        }
        .username { font-size: 14px; font-weight: 600; }
        
        .action-btn {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background-color: var(--accent-blue);
            color: white;
        }
        .action-btn.following {
            background-color: #363636;
        }

        /* [공통] 하트 버튼 스타일 (검정 속 + 흰 테두리) */
        .heart-btn { 
            cursor: pointer; transition: all 0.2s ease; user-select: none;
            color: black; -webkit-text-stroke: 1.5px white; 
        }
        .heart-btn.liked { 
            color: var(--heart-red); -webkit-text-stroke: 1px var(--heart-red);
        }

        /* 5. 하단 네비게이션 바 (유기적 연결 수정) */
        nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; height: 50px;
            background: #000; border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 100;
        }
        .nav-item { color: var(--text-sub); text-decoration: none; font-size: 24px; }
        .nav-item.active { color: white; }
    </style>
</head>
<body>

    <header>
        <a href="6-1.friends_profile.html" class="back-btn">←</a>
        <div class="header-title">alex_techie</div>
    </header>

    <div class="tabs">
        <div id="tab-followers" class="tab active" onclick="showTab('followers')">1.2k followers</div>
        <div id="tab-following" class="tab" onclick="showTab('following')">340 following</div>
    </div>

    <main id="followers-list" class="list-container active">
        <div class="user-item">
            <a href="6-1.friends_profile.html" class="user-info" style="text-decoration: none; color: inherit;">
                <img src="https://i.pravatar.cc/150?u=sarah" class="avatar">
                <div class="username">sarah_design</div>
            </a>
            <button class="action-btn" onclick="toggleFollow(this)">Follow</button>
        </div>
        <div class="user-item">
            <a href="6-1.friends_profile.html" class="user-info" style="text-decoration: none; color: inherit;">
                <img src="https://i.pravatar.cc/150?u=casey" class="avatar">
                <div class="username">casey_vibes</div>
            </a>
            <button class="action-btn following" onclick="toggleFollow(this)">Following</button>
        </div>
    </main>

    <main id="following-list" class="list-container">
        <div class="user-item">
            <a href="6-1.friends_profile.html" class="user-info" style="text-decoration: none; color: inherit;">
                <img src="https://i.pravatar.cc/150?u=jordan" class="avatar">
                <div class="username">jordan_minimal</div>
            </a>
            <button class="action-btn following" onclick="toggleFollow(this)">Following</button>
        </div>
    </main>

    <nav>
        <a href="1-1.home.html" class="nav-item">🏠</a>
        <a href="2-1.explore.html" class="nav-item">🔍</a>
        <a href="3-1.create_post.html" class="nav-item">📸</a>
        <a href="4-1.my_profile.html" class="nav-item">👤</a>
    </nav>


    <script>
        function showTab(tabName) {
            document.getElementById('followers-list').classList.remove('active');
            document.getElementById('following-list').classList.remove('active');
            document.getElementById('tab-followers').classList.remove('active');
            document.getElementById('tab-following').classList.remove('active');
            
            if (tabName === 'followers') {
                document.getElementById('followers-list').classList.add('active');
                document.getElementById('tab-followers').classList.add('active');
            } else {
                document.getElementById('following-list').classList.add('active');
                document.getElementById('tab-following').classList.add('active');
            }
        }

        function toggleFollow(btn) {
            if (btn.innerText === "Follow") {
                btn.innerText = "Following";
                btn.classList.add("following");
            } else {
                btn.innerText = "Follow";
                btn.classList.remove("following");
            }
        }

        // 공통 하트 토글 로직 (일관성 유지)
        function toggleLike(element) {
            if (element.classList.contains('liked')) {
                element.classList.remove('liked');
            } else {
                element.classList.add('liked');
            }
        }
    </script>

</body>
</html>
