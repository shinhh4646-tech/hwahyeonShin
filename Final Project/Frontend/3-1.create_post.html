<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse | New Post</title>
    <style>
        :root {
            --bg-color: #000000;         
            --text-main: #FFFFFF;       
            --text-sub: #A8A8A8;        
            --border-color: #262626;    
            --button-bg: #1A1A1A;      
            --accent-blue: #0095f6;
            --heart-red: #ed4956;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding-bottom: 60px; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 1. 상단 헤더 */
        header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: #000;
        }
        .header-btn {
            color: var(--text-main);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
        }
        .header-title { font-size: 18px; font-weight: 700; }
        .share-btn { color: var(--accent-blue); }
        .share-btn:disabled { color: #00376b; cursor: default; }

        /* 2. 카메라 프리뷰 영역 (1:1 비율) */
        .camera-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #111;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #video, #canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #canvas { display: none; }

        /* 3. 포스트 컨트롤 영역 */
        .post-content {
            padding: 20px 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .caption-input {
            width: 100%;
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            resize: none;
            margin-bottom: 30px;
            outline: none;
        }
        
        .shutter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .shutter-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: white;
            border: 5px solid #333;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .retake-btn {
            display: none;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* [공통] 하트 버튼 스타일 (검정 속 + 흰 테두리) */
        .heart-btn { 
            cursor: pointer; transition: all 0.2s ease; user-select: none;
            color: black; -webkit-text-stroke: 1.5px white; 
        }
        .heart-btn.liked { 
            color: var(--heart-red); 
            -webkit-text-stroke: 1px var(--heart-red);
        }

        /* 4. 하단 네비게이션 바 (유기적 연결 수정) */
        nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            height: 50px;
            background: #000;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 24px;
        }
        .nav-item.active {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header>
        <button class="header-btn" onclick="location.href='1-1.home.html'">Cancel</button>
        <div class="header-title">New Post</div>
        <button class="header-btn share-btn" id="share-btn" disabled onclick="submitPost()">Share</button>
    </header>

    <main class="camera-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </main>

    <section class="post-content">
        <textarea class="caption-input" placeholder="Write a caption..." rows="2"></textarea>
        
        <div class="shutter-container">
            <button class="shutter-btn" id="shutter"></button>
            <div class="retake-btn" id="retake">Retake Photo</div>
        </div>
    </section>

    <nav>
        <a href="1-1.home.html" class="nav-item">🏠</a>
        <a href="2-1.explore.html" class="nav-item">🔍</a>
        <a href="3-1.create_post.html" class="nav-item active">📸</a>
        <a href="4-1.my_profile.html" class="nav-item">👤</a>
    </nav>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const shutterBtn = document.getElementById('shutter');
        const retakeBtn = document.getElementById('retake');
        const shareBtn = document.getElementById('share-btn');

        // 카메라 시작
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: 500, height: 500 }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error accessing camera: ", err);
                alert("Please enable camera access to create a post.");
            }
        }

        // 촬영 이벤트
        shutterBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            video.style.display = 'none';
            canvas.style.display = 'block';
            shutterBtn.style.display = 'none';
            retakeBtn.style.display = 'block';
            shareBtn.disabled = false;
        });

        // 다시 찍기 이벤트
        retakeBtn.addEventListener('click', () => {
            video.style.display = 'block';
            canvas.style.display = 'none';
            shutterBtn.style.display = 'block';
            retakeBtn.style.display = 'none';
            shareBtn.disabled = true;
        });

        // 포스트 제출 시나리오
        function submitPost() {
            alert('Post Shared successfully!');
            location.href = '1-1.home.html';
        }

        // 공통 하트 토글 로직 (일관성 유지)
        function toggleLike(element) {
            if (element.classList.contains('liked')) {
                element.classList.remove('liked');
            } else {
                element.classList.add('liked');
            }
        }

        startCamera();
    </script>
</body>
</html>
