<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse | Sign Up</title>
    <style>
        /* 1. Pulse 테마 설정 */
        :root {
            --bg-color: #000000;
            --text-main: #FFFFFF;
            --text-sub: #A8A8A8;
            --border-color: #262626;
            --input-bg: #121212;
            --accent-blue: #0095f6;
            --heart-red: #ed4956;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .signup-container {
            width: 100%;
            max-width: 350px;
            padding: 20px;
            text-align: center;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 15px;
        }

        .description {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 30px;
            line-height: 1.4;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .name-row {
            display: flex;
            gap: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: white;
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: #555;
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        .terms {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 25px;
            line-height: 1.5;
        }
        .terms b { color: #ccc; cursor: pointer; }

        .footer-box {
            margin-top: 25px;
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
            font-size: 14px;
        }
        .footer-box a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
        }

        /* [공통] 하트 버튼 스타일 (프로젝트 일관성 유지) */
        .heart-btn { 
            cursor: pointer; transition: all 0.2s ease; user-select: none;
            color: black; -webkit-text-stroke: 1.5px white; 
        }
        .heart-btn.liked { 
            color: var(--heart-red); 
            -webkit-text-stroke: 1px var(--heart-red);
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="logo">Pulse</div>
        <div class="description">Sign up to see photos and videos from your friends.</div>

        <form action="1-1.home.html">
            <input type="text" class="form-input" placeholder="Mobile Number or Email" required>
            
            <div class="name-row">
                <input type="text" class="form-input" placeholder="Last Name" required>
                <input type="text" class="form-input" placeholder="First Name" required>
            </div>

            <input type="text" class="form-input" placeholder="Username (ID)" required>
            <input type="password" class="form-input" placeholder="Password" required>

            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <div class="terms">
            By signing up, you agree to our <b>Terms</b>, <b>Data Policy</b> and <b>Cookies Policy</b>.
        </div>

        <div class="footer-box">
            Have an account? <a href="5-1.login.html">Log In</a>
        </div>
    </div>

    <script>
        // 공통 하트 토글 로직 (프로젝트 디자인 통일용)
        function toggleLike(element) {
            if (element.classList.contains('liked')) {
                element.classList.remove('liked');
            } else {
                element.classList.add('liked');
            }
        }
    </script>

</body>
</html>
