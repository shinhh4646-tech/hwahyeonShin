<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse | Explore</title>
    <style>
        /* Pulse Theme Settings */
        :root {
            --bg-color: #000000;
            --text-main: #FFFFFF;
            --text-sub: #A8A8A8;
            --border-color: #262626;
            --search-bg: #1A1A1A;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding-bottom: 80px;
        }

        /* 1. Header with Search Bar */
        header {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.95);
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .search-container {
            background: var(--search-bg);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
        }

        .search-icon {
            margin-right: 10px;
            font-size: 14px;
            color: var(--text-sub);
        }

        .search-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            width: 100%;
            outline: none;
            font-size: 14px;
        }

        .search-input::placeholder {
            color: var(--text-sub);
        }

        /* 2. Adjusted Image Grid (3-Column Portrait Ratio) */
        .explore-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px; /* Spacing between cards */
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .grid-item {
            aspect-ratio: 3 / 4; /* Portrait ratio matching your reference image */
            background-color: #1a1a1a;
            background-size: cover;
            background-position: center;
            border-radius: 12px; /* Rounded corners for a modern feel */
            border: 1px solid var(--border-color);
        }

        /* 3. Bottom Navigation Bar */
        nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            height: 60px;
            background: #000;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 24px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    
    <header>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="Search interests">
        </div>
    </header>

    <main class="explore-grid">
        <div class="grid-item" style="background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400');"></div>
        <div class="grid-item" style="background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400');"></div>
        <div class="grid-item" style="background-image: url('https://images.unsplash.com/photo-1493246507139-91e8bef99c02?w=400');"></div>
        <div class="grid-item" style="background-image: url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=400');"></div>
        <div class="grid-item" style="background-image: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?w=400');"></div>
        <div class="grid-item" style="background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?w=400');"></div>
        <div class="grid-item" style="background-image: url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=400');"></div>
        <div class="grid-item" style="background-image: url('https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?w=400');"></div>
        <div class="grid-item" style="background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=400');"></div>
    </main>

    <nav>
        <a href="#" class="nav-item">🏠</a>
        <a href="#" class="nav-item active">🔍</a>
        <a href="#" class="nav-item">📸</a>
        <a href="#" class="nav-item">👤</a>
    </nav>

</body>
</html>
