<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse | Report</title>
    <style>
        /* 1. Pulse 테마: 블랙 & 미니멀 */
        :root {
            --bg-color: #000000;
            --text-main: #FFFFFF;
            --text-sub: #A8A8A8;
            --border-color: #262626;
            --accent-red: #ed4956;
            --input-bg: #121212;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding-bottom: 60px;
        }

        /* 2. 상단 헤더 */
        header {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.95);
            padding: 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }
        .back-btn { 
            font-size: 20px; 
            text-decoration: none; 
            color: white; 
            margin-right: 20px; 
            cursor: pointer;
        }
        .header-title { font-size: 18px; font-weight: 700; }

        /* 3. 신고 컨테이너 */
        .report-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        .input-group { margin-bottom: 30px; }
        .report-heading {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }
        .id-input {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        .id-input:focus { border-color: #555; }

        .report-list { list-style: none; padding: 0; margin: 0; }
        .report-item {
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .report-item:last-child { border-bottom: none; }
        .report-label { font-size: 14px; color: var(--text-main); }
        .chevron { color: var(--text-sub); font-size: 18px; }

        .submit-section { margin-top: 30px; }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }

        /* [공통] 하트 버튼 스타일 (요청 사항 반영) */
        .heart-btn { 
            cursor: pointer; 
            transition: all 0.2s ease; 
            user-select: none;
            color: black; /* 속: 검정 */
            -webkit-text-stroke: 1.5px white; /* 테두리: 흰색 */
        }
        .heart-btn.liked { 
            color: var(--accent-red); /* 클릭 시 빨간색 */
            -webkit-text-stroke: 1px var(--accent-red);
        }

        /* 4. 하단 네비게이션 바 (유기적 연결) */
        nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            height: 50px;
            background: #000;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <header>
        <a href="1-1.home.html" class="back-btn">←</a>
        <div class="header-title">Report User</div>
    </header>

    <main class="report-container">
        <div class="input-group">
            <div class="report-heading">Reporting User ID</div>
            <input type="text" id="target-id" class="id-input" placeholder="Enter username (ID) to report...">
        </div>

        <div class="report-heading">Why are you reporting this user?</div>
        <ul class="report-list">
            <li class="report-item" onclick="selectReason(this, 'Spam')">
                <span class="report-label">It's spam</span>
                <span class="chevron">›</span>
            </li>
            <li class="report-item" onclick="selectReason(this, 'Inappropriate content')">
                <span class="report-label">Inappropriate content</span>
                <span class="chevron">›</span>
            </li>
            <li class="report-item" onclick="selectReason(this, 'Bot activity')">
                <span class="report-label">Suspicious / Bot activity</span>
                <span class="chevron">›</span>
            </li>
            <li class="report-item" onclick="selectReason(this, 'Something else')">
                <span class="report-label">Something else</span>
                <span class="chevron">›</span>
            </li>
        </ul>

        <div class="submit-section">
            <button class="submit-btn" onclick="submitReport()">Submit Report</button>
        </div>
    </main>

    <nav>
        <a href="1-1.home.html" class="nav-item">🏠</a>
        <a href="2-1.explore.html" class="nav-item">🔍</a>
        <a href="3-1.create_post.html" class="nav-item">📸</a>
        <a href="4-1.my_profile.html" class="nav-item">👤</a>
    </nav>

    <script>
        let selectedReason = "";

        // 하트 토글 공통 로직 (스타일 확인용)
        function toggleLike(element) {
            if (element.classList.contains('liked')) {
                element.classList.remove('liked');
            } else {
                element.classList.add('liked');
            }
        }

        function selectReason(element, reason) {
            const items = document.querySelectorAll('.report-label');
            items.forEach(item => item.style.color = 'white');
            element.querySelector('.report-label').style.color = '#ed4956';
            selectedReason = reason;
        }

        function submitReport() {
            const targetID = document.getElementById('target-id').value;
            if (!targetID) {
                alert("Please enter the ID of the user you want to report.");
                return;
            }
            if (!selectedReason) {
                alert("Please select a reason for reporting.");
                return;
            }
            alert("Report submitted for @" + targetID + "\nReason: " + selectedReason);
            // 제출 완료 후 메인 피드로 이동
            location.href = '1-1.home.html'; 
        }
    </script>

</body>
</html>
