<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse | Friend's Feed</title>
    <style>
        /* Pulse Theme Settings */
        :root {
            --bg-color: #000000;         
            --text-main: #FFFFFF;       
            --text-sub: #A8A8A8;        
            --border-color: #262626;    
            --modal-bg: #262626;
            --heart-red: #ed4956;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding-bottom: 60px;
        }

        /* 1. Header with Back Button */
        header {
            position: sticky; top: 0;
            background: rgba(0, 0, 0, 0.95);
            padding: 12px 15px;
            display: flex; align-items: center;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }
        .back-btn { 
            font-size: 20px; text-decoration: none; color: white; 
            margin-right: 20px; cursor: pointer; 
        }
        .header-title { font-size: 16px; font-weight: 700; flex: 1; text-align: center; margin-right: 40px; }

        /* 2. Main Feed Container */
        .feed { max-width: 500px; margin: 0 auto; }
        .post-card { border-bottom: 1px solid var(--border-color); margin-bottom: 15px; padding-bottom: 10px; }

        .user-bar { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
        .avatar { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border-color); object-fit: cover; }
        .username { font-size: 14px; font-weight: 600; }

        .options-btn { color: white; font-size: 18px; cursor: pointer; background: none; border: none; }

        .media-container { width: 100%; aspect-ratio: 1 / 1; background: #1a1a1a; overflow: hidden; }
        .post-img { width: 100%; height: 100%; object-fit: cover; }

        .post-content { padding: 12px 15px; }
        
        /* [공통] 하트 버튼 디자인: 검정 속 + 흰 테두리 */
        .interaction-icons { display: flex; gap: 15px; font-size: 26px; margin-bottom: 10px; }
        .heart-btn { 
            cursor: pointer; transition: all 0.2s ease; user-select: none;
            color: black; -webkit-text-stroke: 1.5px white; 
        }
        /* 좋아요 클릭 시: 빨간색 */
        .heart-btn.liked { 
            color: var(--heart-red); -webkit-text-stroke: 1px var(--heart-red);
            transform: scale(1.1);
        }
        .heart-btn:active { transform: scale(1.3); }

        .likes-link { text-decoration: none; color: var(--text-main); font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px; }
        .caption { font-size: 14px; line-height: 1.4; }

        /* 3. Bottom Navigation Bar */
        nav { 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 500px; height: 50px; 
            background: #000; border-top: 1px solid var(--border-color); 
            display: flex; justify-content: space-around; align-items: center; z-index: 100; 
        }
        .nav-item { color: var(--text-sub); text-decoration: none; font-size: 24px; }

        /* Report Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background-color: var(--modal-bg); width: 280px; border-radius: 12px; overflow: hidden; text-align: center; }
        .modal-option { padding: 15px; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 1px solid #363636; color: white; text-decoration: none; display: block; }
        .modal-option.report { color: #ed4956; }
    </style>
</head>
<body>

    <header>
        <a href="6-1.friends_profile.html" class="back-btn">←</a>
        <div class="header-title">Posts</div>
    </header>

    <main class="feed">
        <article class="post-card">
            <div class="user-bar">
                <a href="6-1.friends_profile.html" class="user-info">
                    <img src="https://i.pravatar.cc/150?u=alex" class="avatar">
                    <div class="username">alex_techie</div>
                </a>
                <button class="options-btn" onclick="openModal()">•••</button>
            </div>
            <div class="media-container">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600" class="post-img">
            </div>
            <div class="post-content">
                <div class="interaction-icons">
                    <span class="heart-btn" onclick="toggleLike(this)">♥</span>
                </div>
                <a href="5-3.likes.html" class="likes-link"><span class="like-count">52</span> likes</a>
                <div class="caption"><b>alex_techie</b> Focus mode on. 💻</div>
            </div>
        </article>

        <article class="post-card">
            <div class="user-bar">
                <a href="6-1.friends_profile.html" class="user-info">
                    <img src="https://i.pravatar.cc/150?u=alex" class="avatar">
                    <div class="username">alex_techie</div>
                </a>
                <button class="options-btn" onclick="openModal()">•••</button>
            </div>
            <div class="media-container">
                <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600" class="post-img">
            </div>
            <div class="post-content">
                <div class="interaction-icons">
                    <span class="heart-btn" onclick="toggleLike(this)">♥</span>
                </div>
                <a href="5-3.likes.html" class="likes-link"><span class="like-count">84</span> likes</a>
                <div class="caption"><b>alex_techie</b> Clean code, clean life. ✨</div>
            </div>
        </article>
    </main>

    <div class="modal-overlay" id="reportModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <a href="1-2.alert.html" class="modal-option report">Report User</a>
            <div class="modal-option" onclick="closeModal()">Cancel</div>
        </div>
    </div>

    <nav>
        <a href="1-1.home.html" class="nav-item">🏠</a>
        <a href="2-1.explore.html" class="nav-item">🔍</a>
        <a href="3-1.create_post.html" class="nav-item">📸</a>
        <a href="4-1.my_profile.html" class="nav-item">👤</a>
    </nav>

    <script>
        // 하트 토글 함수
        function toggleLike(element) {
            const likeCountElement = element.closest('.post-content').querySelector('.like-count');
            let count = parseInt(likeCountElement.innerText);

            if (element.classList.contains('liked')) {
                element.classList.remove('liked');
                likeCountElement.innerText = count - 1;
            } else {
                element.classList.add('liked');
                likeCountElement.innerText = count + 1;
            }
        }

        // 모달 제어
        const modal = document.getElementById('reportModal');
        function openModal() { modal.style.display = 'flex'; }
        function closeModal() { modal.style.display = 'none'; }
    </script>

</body>
</html>
