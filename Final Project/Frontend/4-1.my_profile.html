<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse | Profile</title>
    <style>
        /* Pulse Theme Settings */
        :root {
            --bg-color: #000000;         
            --text-main: #FFFFFF;       
            --text-sub: #A8A8A8;        
            --border-color: #262626;    
            --heart-red: #ed4956;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding-bottom: 60px; 
        }

        /* 1. Profile Header Area */
        header {
            padding: 30px 15px 25px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .profile-top {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 15px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            object-fit: cover;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex: 1;
            justify-content: space-around;
            text-align: center;
        }

        .stat-link {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .stat-item b { display: block; font-size: 16px; }
        .stat-item span { font-size: 12px; color: var(--text-sub); }

        .username {
            font-size: 18px;
            font-weight: 700;
            margin-top: 5px;
        }

        /* 2. Post Grid Area */
        .post-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            max-width: 500px;
            margin: 2px auto 0;
        }
        
        .grid-item {
            aspect-ratio: 1 / 1;
            background-color: #1a1a1a;
            background-size: cover;
            background-position: center;
            display: block; /* a 태그 적용을 위해 */
        }

        /* [공통] 하트 버튼 스타일 (검정 속 + 흰 테두리) */
        .heart-btn { 
            cursor: pointer; transition: all 0.2s ease; user-select: none;
            color: black; -webkit-text-stroke: 1.5px white; 
        }
        .heart-btn.liked { 
            color: var(--heart-red); 
            -webkit-text-stroke: 1px var(--heart-red);
        }

        /* 3. Bottom Navigation Bar (유기적 연결 수정) */
        nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            height: 50px;
            background: #000;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        
        .nav-item {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 24px;
        }
        
        .nav-item.active {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header>
        <div class="profile-top">
            <div class="avatar" style="background-image: url('https://i.pravatar.cc/150?u=me'); background-size: cover;"></div>
            
            <div class="stats">
                <a href="4-3.feed.html" class="stat-link">
                    <div class="stat-item"><b>3</b><span>Posts</span></div>
                </a>
                
                <a href="4-2.connections.html" class="stat-link">
                    <div class="stat-item"><b>156</b><span>Followers</span></div>
                </a>
                
                <a href="4-2.connections.html" class="stat-link">
                    <div class="stat-item"><b>92</b><span>Following</span></div>
                </a>
            </div>
        </div>
        <div class="username">tom_cruise</div>
    </header>

    <main class="post-grid">
        <a href="4-3.feed.html" class="grid-item" style="background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=300');"></a>
        <a href="4-3.feed.html" class="grid-item" style="background-image: url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=300');"></a>
        <a href="4-3.feed.html" class="grid-item" style="background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?w=300');"></a>
    </main>

    <nav>
        <a href="1-1.home.html" class="nav-item">🏠</a>
        <a href="2-1.explore.html" class="nav-item">🔍</a>
        <a href="3-1.create_post.html" class="nav-item">📸</a>
        <a href="4-1.my_profile.html" class="nav-item active">👤</a>
    </nav>

    <script>
        // 공통 하트 토글 로직
        function toggleLike(element) {
            if (element.classList.contains('liked')) {
                element.classList.remove('liked');
            } else {
                element.classList.add('liked');
            }
        }
    </script>

</body>
</html>
